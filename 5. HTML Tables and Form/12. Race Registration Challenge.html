<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Registration Challenge</title>
  </head>
  <body>
    <h1>Race Registration!</h1>
    <form action="">
      <section id="names">
        <label for="first">First Name</label>
        <input type="text" name="first" id="first" required />
        <label for="last">Last Name</label>
        <input type="text" name="last" id="last" required />
      </section>
      <section id="race-category">
        <p>Select a Race:</p>
        <div>
          <input
            type="radio"
            name="category"
            id="fun-run-5k"
            value="fun-run-5k"
          />
          <label for="fun-run-5k">Fun Run 5K</label>
        </div>
        <div>
          <input
            type="radio"
            name="category"
            id="half-marathon"
            value="half-marathon"
          />
          <label for="half-marathon">Half Marathon</label>
        </div>
        <div>
          <input
            type="radio"
            name="category"
            id="full-marathon"
            value="full-marathon"
          />
          <label for="full-marathon">Full Marathon</label>
        </div>
      </section>
      <section id="email-pass">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required />
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required />
      </section>
      <section id="age">
        <label for="age-group">Select Age Group</label>
        <select name="age-group" id="age-group">
          <option value="Under 18">Under 18</option>
          <option value="18-30">18-30</option>
          <option value="30-50">30-50</option>
          <option value="50+">50+</option>
        </select>
      </section>
      <button>Register!</button>
    </form>
  </body>
</html>
